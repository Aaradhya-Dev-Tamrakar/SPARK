[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spark"
version = "0.1.0"
description = "Signal Pattern Analysis & Real-time Kinetics — Two-layer gated wearable fall detection system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aaradhya Dev Tamrakar", email = "aaradhyadevtmr@gmail.com" },
    { name = "Rupesh Kadel" },
    { name = "Sankalpa Lamsal" },
    { name = "Sonia Thapa" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
ml = [
    "tensorflow>=2.15.0",
    "xgboost>=2.0.0",
    "shap>=0.44.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.4",
    "pre-commit>=3.6.0",
    "nbformat>=5.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway*", "training*", "tools*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "__pycache__",
    ".ipynb_checkpoints",
    "*.ipynb",
    "firmware",
    "docs/SPARK_Proposal",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by ruff format
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["gateway", "training", "tools"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "gateway", "training"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
